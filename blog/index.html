<script>window.BLOG_DATA={"site":{"name":"WriteBugsProfessionally的博客","subtitle":"记录那些与 Bug 斗智斗勇的日子","about":"牢"},"posts":[{"id":"mvmd25ftlhppi8","title":"关于steamdeck装双系统以及还原成单一steamOS有关事宜","category":"硬件设备_steamdeck","tags":["steamdeck","系统"],"content":"## 一、steamdeck装steamOS+windows双系统\n### 1.准备硬件\n一台steamdeck，或者steamdeckoled，一到二个U盘（>8GB）,windows环境，基础的硬件设备，键盘，鼠标，c口拓展坞，耐心……\n\n### 2.准备文件\nWindows11镜像任意版本，建议最新（兼容性更好）：https://www.microsoft.com/zh-cn/software-download/windows11\nsteamdeck官方恢复镜像：https://store.steampowered.com/steamos/download/?l=schinese&ver=steamdeck\nsteamdeck的windows驱动：https://help.steampowered.com/zh-cn/faqs/view/6121-ECCD-D643-BAA8（尽量就用这些，不要更新显卡驱动等等）\nsteamdeckTools（连接硬件风扇等）：https://github.com/ayufan/steam-deck-tools\nrefus：https://rufus.ie/en/\n任意配pe安装环境：如wepe：https://www.wepe.com.cn/download.html\n\n\n### 3.划出分区\n(1)先在任意环境下下载steamdeck官方恢复镜像，插上U盘，用refus将该镜像烧录进U盘（注意不能用ventoy直接选择官方修复镜像，会失败）；将U盘连接到关机的steamdeck上，同时按下电源键![](asset:img_mvmhx5rdsjqi6r|40px|inline)+![IMG_20261024_221828.jpg](asset:img_mvmik8xm7rirfj|40px|inline)音量减键，进入\n![图片](asset:img_mvmiy6yydy9rgx)\n然后选择USB启动项，按A确定，之后会重启一次，进入恢复界面*（用该环境是为了绕过权限，在正常系统环境下没办法修改硬盘）\n![图片](asset:img_mvmj1wfg0yk4r8)\n桌面这4个从左到右分别是\n   [1]Clear local user data\n翻译：清除本地用户数据\n功能：删除设备上的本地用户账号、设置、个人文件和游戏存档（未同步云端的会丢失），相当于恢复出厂设置，但保留系统本身。慎用。\n\n   [2]Repair SteamOS Install\n翻译：修复 SteamOS 安装\n功能：尝试修复当前损坏的 SteamOS 系统文件。这通常不会删除你的个人数据或游戏，适合系统出问题但不想重装的情况。\n\n   [3]Terminal with repair tools\n翻译：带有修复工具的终端\n功能：打开一个高级命令行界面（终端），里面包含了用于排查和修复系统的工具。适合有 Linux 基础的高级用户手动敲代码修复。\n\n   [4]Wipe Device & Install SteamOS\n翻译：擦除设备并安装 SteamOS\n功能：完全格式化整个硬盘，清除所有数据（包括系统、游戏、存档），并重新安装一个全新的 SteamOS 系统。这是最彻底的重装方式。\n(2)拆分硬盘\n进入![图片](asset:img_mvmj9ocfa6zjfl)\n![图片](asset:img_mvmjofj2t547ti)\n选择“调整大小/移动”\n![图片](asset:img_mvmjqojs6fb0qt)\n这里以400GB为例，确定；右键，新建，选择NTFS文件系统，确定，最后点左上角执行，此时需要耐心等待，可能10几分钟，所以注意电量\n![图片](asset:img_mvmjtz2ssa5l9t)\n之后可以用ventoy启动盘或者其他pe启动盘，这里以ventoy启动wepe为例\n插上ventoy启动盘，按电源键和音量减键，选择从USB启动，和前面一样\n\n\n\n\n\n\n\n\n\n","pinned":false,"created":1792844053769,"updated":1793115566488},{"id":"mvmk6mhqr4btpu","title":"Ventoy的配置与问题","category":"软件","tags":["软件","系统"],"content":"## ！！！！在操作之前一定要备份文件！！！！\n### 1.准备硬件\n一个大容量U盘（>64GB），windows环境，\n\n### 2.准备软件\nventoy：https://www.ventoy.net/en/index.html\npe：(1)wepe：https://www.wepe.com.cn/download.html\n(2)Firpe：https://www.firpe.cn/?sid=U3FOqN\n一些iso文件：https://www.microsoft.com/zh-cn/software-download/windows11；https://www.deepin.org/en/download/；\n\n### 3，开始安装\n(1).把U盘插入电脑，运行Ventoy2Disk.exe；可以选择“配置选项”>“分区设置”选择合适的文件系统，如果要安装其他Windows系统，建议为NTFS；\n安装过程U盘会被格式化，务必备份文件。\n![图片](asset:img_mvnxk5f8k6qvtx|35%|inline)![图片](asset:img_mvnxoofc2tbv61|30%|inline)![图片](asset:img_mvnxpm1i5356ee|30%|inline)\n运行完了会有两个分区Ventoy和VENTOY。其中Ventoy可以正常当作U盘存储文件，而VENTOY分区为引导分区，尽量不要动\n![图片](asset:img_mvnxwprwu1vrxb)\n(2).获取iso文件\n可以在Ventoy分区里放pe和操作系统的iso文件\n![图片](asset:img_mvnxzsp25roiaw|40%|inline)![图片](asset:img_mvny85w68ktln0|40%|inline)\n(3).测试\n关闭机器的安全启动，并且将启动项改为USB，选择wepe，回车\n![图片](asset:img_mvny2c00uwi003|45%|inline)![图片](asset:img_mvnymasv613ntn|45%|inline)\n\n进入wepe\n![图片](asset:img_mvnyscbfsygxqr)\n\n\n\n\n\n\n\n","pinned":false,"created":1792856019806,"updated":1792941527774},{"id":"mvnz1ok67ydw1x","title":"虚拟机的亿点点小bug","category":"虚拟机","tags":["虚拟机"],"content":"## VMware有关\n1.分辨率bug\n在Windows11下，不安装vmtools时，选择1366x768分辨率的时候会出现画面崩坏\n![图片](asset:img_mvnyxofsj94k10|45%|inline)![图片](asset:img_mvnyyspnzu0sog|45%|inline)\n\n其余配置如图\n![图片](asset:img_mvnz0r5c4omc59|50%)\n\n","pinned":false,"created":1792941449622,"updated":1792941449622},{"id":"mvqp3zc912mg0g","title":"VMware安装HoloISO","category":"虚拟机","tags":["系统"],"content":"## 1.准备文件\nVMware：https://www.techspot.com/downloads/1969-vmware-player.html\nHoloISO_5.1.1_Tweaked：https://drive.google.com/file/d/1C3pCHsLruh8CanGk5W74FjFZzDoO-R8V/view?pli=1\n（该镜像支持实体机N卡）\n\n## 2.开始安装\n（1）.安装前配置\n安装好VMware之后，打开，新建虚拟机，选择“自定义（高级）”和“稍后安装操作系统”，再选择\n![图片](asset:img_mvqplb8wnh1r7b)\n随便命名，然后CPU4核，最少6GB内存，一般8GB，最好16GB；网络、IO、磁盘都默认，新建磁盘的话>64GB，其他磁盘选项看着来\n\n点击虚拟机设置，记得勾选“启动时连接”，USB控制器选择为USB3.1，其他和图片保持一致，确定\n![图片](asset:img_mvqprn0ieuvj9l|46%|inline)![图片](asset:img_mvqpujfmp89w21|46%|inline)\n\n（2）安装系统\n点击“开启此虚拟机”，稍等一会会进入“Live环境”\n![图片](asset:img_mvqpydesf4jais)\n双击，选择第一个，OK，之后的keyboard有关的都选“us”，其他的time选“Asia-中国的地方”，language选zh_CN UTF-8；wsap选2GB就可以；xbox，8-bit虚拟机应该用不到，decky看个人选择；最后问是否是Loptop，选NO，因为vmware模拟的是台式机环境\n选择硬盘sda，这里先选第一个，双系统可以过后装，最后yes，等待……不过不要立刻重启！！！！！！\n![图片](asset:img_mvqqa74cteiue5)\n（3）安装vmtools，避免黑屏\n安装完毕，点ok\n![图片](asset:img_mvqqij398c0t5h)\n之后在终端输入`sudo arch-chroot /mnt`，进入安装好的系统内部\n再输入`nano /etc/pacman.conf`，去修改内部源，因为原来的默认源似乎已无人维护，没办法安装vmtools\n之后按Ctrl+W，在Search框里输入`holoiso-tweaked`   ，回车，之后Ctrl+O 、回车、Ctrl+X，回到终端\n![图片](asset:img_mvqr9xkhi9ng1t)\n然后再执行\n`pacman -Syy`\n`pacman -S --noconfirm open-vm-tools`\n`systemctl enable vmtoolsd && holoiso-disable-sessions`\n下载，等待，这一步是安装vmtools，并且加入开机自启动，防止卡黑屏\n![图片](asset:img_mvqrk1n7affa6c)\n此处error无所谓，可以看大肥鱼的解释\n![图片](asset:img_mvqrkzrahpbp2e)\n出现Done！就完成了\n此时就可以重启了，耐心等待就好，输入密码后就进入了桌面，可以登录steam了，不过似乎进不去游戏模式\n\n\n\n！！！！！！之后不要轻易改动虚拟机设置，尤其是磁盘更改，会导致系统挂掉！！！！！\n\n\n\n\n\n\n\n\n","pinned":false,"created":1793106159273,"updated":1793114346464}],"assets":{"img_mvmhx5rdsjqi6r":"https://writebugsprofessionally.github.io/blog/images/img_mvmhx5rdsjqi6r.jpg","img_mvmik8xm7rirfj":"https://writebugsprofessionally.github.io/blog/images/img_mvmik8xm7rirfj.jpg","img_mvmiy6yydy9rgx":"https://writebugsprofessionally.github.io/blog/images/img_mvmiy6yydy9rgx.jpg","img_mvmj1wfg0yk4r8":"https://writebugsprofessionally.github.io/blog/images/img_mvmj1wfg0yk4r8.jpg","img_mvmj9ocfa6zjfl":"https://writebugsprofessionally.github.io/blog/images/img_mvmj9ocfa6zjfl.jpg","img_mvmjofj2t547ti":"https://writebugsprofessionally.github.io/blog/images/img_mvmjofj2t547ti.jpg","img_mvmjqojs6fb0qt":"https://writebugsprofessionally.github.io/blog/images/img_mvmjqojs6fb0qt.jpg","img_mvmjtz2ssa5l9t":"https://writebugsprofessionally.github.io/blog/images/img_mvmjtz2ssa5l9t.jpg","img_mvnxk5f8k6qvtx":"https://writebugsprofessionally.github.io/blog/images/img_mvnxk5f8k6qvtx.image/png","img_mvnxoofc2tbv61":"https://writebugsprofessionally.github.io/blog/images/img_mvnxoofc2tbv61.image/png","img_mvnxpm1i5356ee":"https://writebugsprofessionally.github.io/blog/images/img_mvnxpm1i5356ee.image/png","img_mvnxwprwu1vrxb":"https://writebugsprofessionally.github.io/blog/images/img_mvnxwprwu1vrxb.image/png","img_mvnxzsp25roiaw":"https://writebugsprofessionally.github.io/blog/images/img_mvnxzsp25roiaw.image/png","img_mvny2c00uwi003":"https://writebugsprofessionally.github.io/blog/images/img_mvny2c00uwi003.image/png","img_mvny85w68ktln0":"https://writebugsprofessionally.github.io/blog/images/img_mvny85w68ktln0.image/png","img_mvnymasv613ntn":"https://writebugsprofessionally.github.io/blog/images/img_mvnymasv613ntn.image/png","img_mvnyscbfsygxqr":"https://writebugsprofessionally.github.io/blog/images/img_mvnyscbfsygxqr.image/png","img_mvnyxofsj94k10":"https://writebugsprofessionally.github.io/blog/images/img_mvnyxofsj94k10.image/png","img_mvnyyspnzu0sog":"https://writebugsprofessionally.github.io/blog/images/img_mvnyyspnzu0sog.image/png","img_mvnz0r5c4omc59":"https://writebugsprofessionally.github.io/blog/images/img_mvnz0r5c4omc59.image/png","img_mvqplb8wnh1r7b":"https://writebugsprofessionally.github.io/blog/images/img_mvqplb8wnh1r7b.image/png","img_mvqprn0ieuvj9l":"https://writebugsprofessionally.github.io/blog/images/img_mvqprn0ieuvj9l.image/png","img_mvqpujfmp89w21":"https://writebugsprofessionally.github.io/blog/images/img_mvqpujfmp89w21.image/png","img_mvqpydesf4jais":"https://writebugsprofessionally.github.io/blog/images/img_mvqpydesf4jais.image/png","img_mvqqa74cteiue5":"https://writebugsprofessionally.github.io/blog/images/img_mvqqa74cteiue5.image/png","img_mvqqij398c0t5h":"https://writebugsprofessionally.github.io/blog/images/img_mvqqij398c0t5h.image/png","img_mvqr9xkhi9ng1t":"https://writebugsprofessionally.github.io/blog/images/img_mvqr9xkhi9ng1t.image/png","img_mvqrk1n7affa6c":"https://writebugsprofessionally.github.io/blog/images/img_mvqrk1n7affa6c.image/png","img_mvqrkzrahpbp2e":"https://writebugsprofessionally.github.io/blog/images/img_mvqrkzrahpbp2e.image/png"}};</script>
